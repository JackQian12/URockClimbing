openapi: 3.0.3
info:
  title: URock API
  version: 0.3.0
  description: API contract for the URock climbing membership mini program and Web admin.
servers:
  - url: https://api.urockclimbing.cn/api/v1
  - url: http://localhost:8080/api/v1
paths:
  /admin/auth/login:
    post:
      summary: Log in to the Web admin
      tags: [Admin Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Authenticated; also sets the HttpOnly admin session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/auth/logout:
    post:
      summary: Revoke the current Web admin session
      tags: [Admin Auth]
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { description: Logged out }
  /admin/auth/change-password:
    post:
      summary: Change the current administrator password
      tags: [Admin Auth]
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 12, maxLength: 72 }
      responses:
        "200": { description: Password changed }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/me:
    get:
      summary: Get the current Web administrator and a fresh CSRF token
      tags: [Admin Auth]
      security: [{ adminCookie: [] }]
      responses:
        "200":
          description: Current administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/wechat/login:
    post:
      summary: Login or register with a wx.login code
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/refresh:
    post:
      summary: Rotate a refresh token and issue a new token pair
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Token pair rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      summary: Revoke a refresh token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200": { description: Logged out }
  /me:
    get:
      summary: Get the current member
      tags: [Member]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current member
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: Update the current member's optional nickname
      tags: [Member]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, version]
              properties:
                nickname: { type: string, maxLength: 64 }
                version: { type: integer, minimum: 1 }
      responses:
        "200": { description: Updated member profile }
        "409": { description: Version conflict }
  /me/phone:
    post:
      summary: Bind a WeChat-verified phone number and complete member registration
      tags: [Member]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: One-time code returned by button getPhoneNumber }
      responses:
        "200": { description: Registration completed or was already complete }
        "400": { description: Invalid phone authorization code }
        "502": { description: WeChat rejected or could not exchange the code }
  /card-products:
    get:
      summary: List card products currently on sale
      tags: [Cards]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Card product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/CardProductStoreItem" } }
  /card-products/{id}:
    get:
      summary: Get one card product currently on sale
      tags: [Cards]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Card product detail }
        "404": { description: Product does not exist or is not on sale }
  /me/cards:
    get:
      summary: List cards owned by the current member
      tags: [Cards]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200": { description: Member card list }
  /me/cards/{id}:
    get:
      summary: Get one card owned by the current member
      tags: [Cards]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Member card detail }
        "404": { description: Card not found or not owned }
  /me/cards/{id}/redemptions:
    get:
      summary: List redemptions for an owned card
      tags: [Redemptions]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Card redemption list }
  /me/redemptions:
    get:
      summary: List the current member's redemption history
      tags: [Redemptions]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Member redemption list }
  /me/cards/{id}/redemption-token:
    post:
      summary: Create a five-minute one-time redemption token and revoke older active tokens for this card
      tags: [Redemptions]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: One-time token created }
        "409": { description: Card is expired, used up, unavailable, or has reached its daily limit }
  /me/checkins/preview:
    post:
      summary: Validate a reusable venue check-in code and list the current member's usable cards
      tags: [Redemptions]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string, description: Complete payload scanned from a venue QR code } }
      responses:
        "200": { description: Venue name and usable cards }
        "400": { description: Invalid venue code }
        "409": { description: Code is inactive or the member has no usable card today }
  /me/checkins/confirm:
    post:
      summary: Self-check in with a selected card using a reusable venue code
      description: Deducts one use for COUNT_CARD or records a daily check-in for TIME_PASS. The venue code remains reusable until an administrator disables or regenerates it.
      tags: [Redemptions]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, card_id]
              properties:
                token: { type: string }
                card_id: { type: string }
      responses:
        "200": { description: Check-in or redemption completed, including an idempotent replay }
        "409": { description: Code or card is unavailable, or a time pass reached its daily limit }
  /staff/redemptions/preview:
    post:
      summary: Validate a scanned token and preview the member and card
      tags: [Redemptions]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        "200": { description: Redemption preview }
        "403": { description: STAFF or ADMIN role required }
  /staff/redemptions/confirm:
    post:
      summary: Consume a one-time token and redeem the card transactionally
      tags: [Redemptions]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        "200": { description: Redemption completed or the original idempotent result }
        "409": { description: Token or card can no longer be used }
  /staff/redemptions/today:
    get:
      summary: List redemptions performed today by the current staff member
      tags: [Redemptions]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Today's staff redemption list }
  /orders:
    post:
      summary: Create an idempotent pending card purchase order from the current product price and rules
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card_product_id]
              properties:
                card_product_id: { type: string }
      responses:
        "201": { description: Pending order created }
        "200": { description: Existing order returned for the same idempotency key }
        "409": { description: Product is off sale or purchase limit has been reached }
  /me/orders:
    get:
      summary: List orders owned by the current registered member
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: Paginated member order list }
  /me/orders/{order_no}:
    get:
      summary: Get an order owned by the current registered member
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: order_no, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Member order detail }
        "404": { description: Order not found or not owned by the current member }
  /orders/{order_no}/wechat-pay:
    post:
      summary: Prepare signed WeChat JSAPI payment parameters
      description: Validates order ownership and state, persists an idempotent payment transaction, and returns parameters signed for wx.requestPayment. Price and product data always come from the server-side order snapshot.
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: order_no, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Signed JSAPI payment parameters }
        "409": { description: Order is not payable }
        "502": { description: WeChat Pay prepayment request failed }
        "503": { description: Payment credentials are not enabled }
  /orders/{order_no}/sync:
    post:
      summary: Query WeChat Pay and synchronize a member-owned order
      description: A SUCCESS result is validated and settled through the same transactional, idempotent path as the signed callback. Frontend payment success alone never issues a card.
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: order_no, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Provider trade state returned and any successful payment synchronized }
        "404": { description: Order not found or not owned by the current member }
        "502": { description: WeChat Pay query failed }
  /payments/wechat/notify:
    post:
      summary: Receive a signed and encrypted WeChat Pay transaction notification
      description: Validates the WeChat signature, decrypts the resource, verifies AppID, merchant ID, order, CNY amount and transaction ID, then atomically marks the order paid and issues exactly one member card.
      tags: [Payments]
      security: []
      responses:
        "200": { description: Notification accepted, including idempotent duplicates }
        "400": { description: Signature, decryption, or notification state is invalid }
        "500": { description: Settlement failed and WeChat Pay should retry }
  /admin/card-products:
    get:
      summary: List all card products for administration
      tags: [Admin Cards]
      security: [{ adminCookie: [] }]
      responses:
        "200": { description: Card product list }
    post:
      summary: Create a draft card product
      tags: [Admin Cards]
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardProductInput" }
      responses:
        "201": { description: Draft created }
  /admin/card-products/{id}:
    put:
      summary: Update a card product using optimistic locking
      tags: [Admin Cards]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardProductInput" }
      responses:
        "200": { description: Product updated }
        "409": { description: Version conflict }
  /admin/card-products/{id}/status:
    post:
      summary: Publish or unpublish a card product
      tags: [Admin Cards]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { description: Status changed }
  /admin/checkin-codes:
    get:
      summary: List reusable venue check-in codes without exposing QR payloads
      tags: [Admin Check-in Codes]
      security: [{ adminCookie: [] }]
      responses:
        "200": { description: Check-in code list }
    post:
      summary: Create an active reusable venue check-in code
      tags: [Admin Check-in Codes]
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string, minLength: 2, maxLength: 100 } }
      responses:
        "201": { description: Code created; response includes the printable QR payload }
  /admin/checkin-codes/{id}:
    get:
      summary: Get an authenticated printable check-in code payload
      tags: [Admin Check-in Codes]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Code details with QR payload }
        "404": { description: Code not found }
  /admin/checkin-codes/{id}/status:
    put:
      summary: Enable or disable a reusable venue check-in code
      tags: [Admin Check-in Codes]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, version]
              properties:
                status: { type: string, enum: [ACTIVE, INACTIVE] }
                version: { type: integer, minimum: 1 }
      responses:
        "200": { description: Status changed }
        "409": { description: Version conflict }
  /admin/checkin-codes/{id}/regenerate:
    post:
      summary: Replace a venue QR payload and immediately invalidate the previously printed code
      tags: [Admin Check-in Codes]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties: { version: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Payload replaced; response includes the new printable payload }
        "409": { description: Version conflict }
  /admin/members:
    get:
      summary: Search members and view aggregated card, order, and redemption metrics
      tags: [Admin Members]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Member number, nickname, or exact phone last four digits }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, DISABLED] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { description: Paginated member list }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/members/{id}:
    get:
      summary: Get a member profile with aggregated business metrics
      tags: [Admin Members]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Member detail }
        "404": { description: Member not found }
    put:
      summary: Update status, tags, and internal note using optimistic locking
      tags: [Admin Members]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, tags, admin_note, version]
              properties:
                status: { type: string, enum: [ACTIVE, DISABLED] }
                tags: { type: array, maxItems: 10, items: { type: string, maxLength: 20 } }
                admin_note: { type: string, maxLength: 500 }
                version: { type: integer, minimum: 1 }
      responses:
        "200": { description: Member updated }
        "409": { description: Version conflict }
  /admin/orders:
    get:
      summary: Search orders with member, payment, card, redemption, and refund data
      tags: [Admin Orders]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Order number, member number, nickname, or exact phone last four digits }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, PAID, CLOSED, REFUNDING, REFUNDED] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { description: Paginated order list }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/orders/{order_no}:
    get:
      summary: Get order, payment, issued card, redemption, and refund details
      tags: [Admin Orders]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: order_no, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Order detail }
        "404": { description: Order not found }
  /admin/orders/{order_no}/refund:
    post:
      summary: Request a full refund from the Web admin only
      tags: [Admin Orders]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: order_no, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, client_request_id]
              properties:
                reason: { type: string, minLength: 1, maxLength: 80, description: Maximum 80 UTF-8 bytes as required by WeChat Pay }
                client_request_id: { type: string, minLength: 8, maxLength: 64 }
      responses:
        "200": { description: Existing idempotent or final refund returned }
        "202": { description: Refund accepted and card locked pending a final signed result }
        "502": { description: Provider result is unknown; card remains locked until synchronization }
        "409": { description: Refund not allowed }
        "503": { description: WeChat Pay refund is not configured; no order state is changed }
  /admin/refunds/{refund_no}/sync:
    post:
      summary: Query and synchronize one WeChat Pay refund
      tags: [Admin Orders]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: refund_no, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { description: Refund state synchronized }
        "404": { description: Refund not found }
        "502": { description: WeChat Pay query failed }
  /refunds/wechat/notify:
    post:
      summary: Receive a signed and encrypted WeChat Pay refund notification
      description: Keeps the card locked for PROCESSING or ABNORMAL, marks it permanently refunded on SUCCESS, and restores it only when WeChat explicitly returns CLOSED.
      tags: [Payments]
      security: []
      responses:
        "200": { description: Notification accepted, including idempotent duplicates }
        "400": { description: Signature, decryption, or refund payload is invalid }
        "500": { description: Synchronization failed and WeChat Pay should retry }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminCookie:
      type: apiKey
      in: cookie
      name: urock_admin_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request
    Unauthorized:
      description: Authentication required
  schemas:
    CardProductStoreItem:
      type: object
      required: [id, name, short_description, description, product_type, total_times, validity_days, activation_mode, price_cent, daily_use_limit, transferable, rules, theme_color]
      properties:
        id: { type: string }
        name: { type: string }
        short_description: { type: string }
        description: { type: string }
        product_type: { type: string, enum: [COUNT_CARD, TIME_PASS] }
        total_times: { type: integer, nullable: true }
        validity_days: { type: integer }
        activation_mode: { type: string, enum: [PURCHASE, FIRST_USE] }
        price_cent: { type: integer }
        list_price_cent: { type: integer, nullable: true }
        purchase_limit: { type: integer, nullable: true }
        daily_use_limit: { type: integer }
        transferable: { type: boolean }
        rules: { type: string }
        badge: { type: string, nullable: true }
        theme_color: { type: string }
    CardProductInput:
      type: object
      required: [name, short_description, description, product_type, validity_days, activation_mode, price_cent, daily_use_limit, transferable, rules, theme_color, sort_order, version]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        short_description: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 5000 }
        product_type: { type: string, enum: [COUNT_CARD, TIME_PASS] }
        total_times: { type: integer, minimum: 1, maximum: 1000, nullable: true, description: Required for COUNT_CARD and null for TIME_PASS }
        validity_days: { type: integer, minimum: 1, maximum: 3650, description: TIME_PASS only accepts 7, 30, 90, or 365 }
        activation_mode: { type: string, enum: [PURCHASE, FIRST_USE], description: TIME_PASS must use FIRST_USE }
        price_cent: { type: integer, minimum: 1 }
        list_price_cent: { type: integer, minimum: 1, nullable: true }
        purchase_limit: { type: integer, minimum: 1, maximum: 100, nullable: true }
        daily_use_limit: { type: integer, minimum: 1, maximum: 20, description: TIME_PASS must equal 1 }
        transferable: { type: boolean, description: TIME_PASS must be false }
        rules: { type: string, maxLength: 5000 }
        badge: { type: string, maxLength: 32, nullable: true }
        theme_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        sort_order: { type: integer }
        version: { type: integer, minimum: 0, description: Required and greater than zero when updating }
    CardProduct:
      allOf:
        - $ref: "#/components/schemas/CardProductInput"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id: { type: string }
            status: { type: string, enum: [DRAFT, ON_SALE, OFF_SALE] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    OrderProductSnapshot:
      type: object
      required: [product_id, name, product_type, validity_days, activation_mode, price_cent, daily_use_limit, transferable]
      properties:
        product_id: { type: string }
        name: { type: string }
        product_type: { type: string, enum: [COUNT_CARD, TIME_PASS] }
        total_times: { type: integer, nullable: true }
        validity_days: { type: integer }
        activation_mode: { type: string, enum: [PURCHASE, FIRST_USE] }
        price_cent: { type: integer }
        daily_use_limit: { type: integer }
        transferable: { type: boolean }
    MemberOrder:
      type: object
      required: [order_no, status, biz_type, total_amount_cent, paid_amount_cent, product_snapshot, expires_at, created_at, updated_at]
      properties:
        order_no: { type: string }
        status: { type: string, enum: [PENDING, PAID, CLOSED, REFUNDING, REFUNDED] }
        biz_type: { type: string, enum: [CARD_PURCHASE] }
        total_amount_cent: { type: integer }
        paid_amount_cent: { type: integer }
        product_snapshot: { $ref: "#/components/schemas/OrderProductSnapshot" }
        expires_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AuthTokenEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [access_token, refresh_token, expires_in]
          properties:
            access_token: { type: string }
            refresh_token: { type: string }
            expires_in: { type: integer, example: 900 }
        request_id: { type: string }
    AdminSessionEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [user, csrf_token]
          properties:
            user:
              type: object
              required: [id, username, role, must_change_password]
              properties:
                id: { type: string }
                username: { type: string }
                nickname: { type: string, nullable: true }
                role: { type: string, enum: [ADMIN] }
                must_change_password: { type: boolean }
            csrf_token: { type: string }
        request_id: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
