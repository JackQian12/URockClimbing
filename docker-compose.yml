name: urock

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-urock}
      MYSQL_USER: ${MYSQL_USER:-urock}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  migrate:
    image: migrate/migrate:v4.18.3
    profiles: [tools]
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=mysql://${MYSQL_USER:-urock}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE:-urock}
      - up
    depends_on:
      mysql:
        condition: service_healthy
    networks: [internal]

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      MYSQL_DSN: ${MYSQL_USER:-urock}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE:-urock}?parseTime=true&charset=utf8mb4&loc=UTC
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      PHONE_DATA_KEY: ${PHONE_DATA_KEY:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_LOGIN_MOCK: ${WECHAT_LOGIN_MOCK:-false}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_CERT_SERIAL_NO: ${WECHAT_PAY_CERT_SERIAL_NO:-}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/urock-api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./admin-web/dist:/usr/share/nginx/html/admin:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    depends_on: [api]
    networks: [internal]

  certbot:
    image: certbot/certbot:latest
    profiles: [tools]
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt

volumes:
  mysql_data:

networks:
  internal:
    driver: bridge
