openapi: 3.0.3
info:
  title: URock API
  version: 0.2.0
  description: API contract for the URock climbing membership mini program and Web admin.
servers:
  - url: https://api.urockclimbing.cn/api/v1
  - url: http://localhost:8080/api/v1
paths:
  /admin/auth/login:
    post:
      summary: Log in to the Web admin
      tags: [Admin Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Authenticated; also sets the HttpOnly admin session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/auth/logout:
    post:
      summary: Revoke the current Web admin session
      tags: [Admin Auth]
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { description: Logged out }
  /admin/auth/change-password:
    post:
      summary: Change the current administrator password
      tags: [Admin Auth]
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 12, maxLength: 72 }
      responses:
        "200": { description: Password changed }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/me:
    get:
      summary: Get the current Web administrator and a fresh CSRF token
      tags: [Admin Auth]
      security: [{ adminCookie: [] }]
      responses:
        "200":
          description: Current administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/wechat/login:
    post:
      summary: Login or register with a wx.login code
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/refresh:
    post:
      summary: Rotate a refresh token and issue a new token pair
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Token pair rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      summary: Revoke a refresh token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200": { description: Logged out }
  /me:
    get:
      summary: Get the current member
      tags: [Member]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current member
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      summary: Update the current member's optional nickname
      tags: [Member]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, version]
              properties:
                nickname: { type: string, maxLength: 64 }
                version: { type: integer, minimum: 1 }
      responses:
        "200": { description: Updated member profile }
        "409": { description: Version conflict }
  /me/phone:
    post:
      summary: Bind a WeChat-verified phone number and complete member registration
      tags: [Member]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: One-time code returned by button getPhoneNumber }
      responses:
        "200": { description: Registration completed or was already complete }
        "400": { description: Invalid phone authorization code }
        "502": { description: WeChat rejected or could not exchange the code }
  /card-products:
    get:
      summary: List card products currently on sale
      tags: [Cards]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Card product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/CardProductStoreItem" } }
  /card-products/{id}:
    get:
      summary: Get one card product currently on sale
      tags: [Cards]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Card product detail }
        "404": { description: Product does not exist or is not on sale }
  /orders:
    post:
      summary: Create an idempotent pending card purchase order from the current product price and rules
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card_product_id]
              properties:
                card_product_id: { type: string }
      responses:
        "201": { description: Pending order created }
        "200": { description: Existing order returned for the same idempotency key }
        "409": { description: Product is off sale or purchase limit has been reached }
  /me/orders:
    get:
      summary: List orders owned by the current registered member
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: Paginated member order list }
  /me/orders/{order_no}:
    get:
      summary: Get an order owned by the current registered member
      tags: [Orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: order_no, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Member order detail }
        "404": { description: Order not found or not owned by the current member }
  /orders/{order_no}/wechat-pay:
    post:
      summary: Prepare signed WeChat JSAPI payment parameters
      description: During merchant review this endpoint validates ownership and state, then returns WECHAT_PAY_UNDER_REVIEW without creating a payment transaction.
      tags: [Payments]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: order_no, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Signed JSAPI payment parameters after the approved adapter is deployed }
        "409": { description: Order is not payable }
        "503": { description: Merchant review is not complete; no payment transaction or funds movement occurs }
  /admin/card-products:
    get:
      summary: List all card products for administration
      tags: [Admin Cards]
      security: [{ adminCookie: [] }]
      responses:
        "200": { description: Card product list }
    post:
      summary: Create a draft card product
      tags: [Admin Cards]
      security: [{ adminCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardProductInput" }
      responses:
        "201": { description: Draft created }
  /admin/card-products/{id}:
    put:
      summary: Update a card product using optimistic locking
      tags: [Admin Cards]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardProductInput" }
      responses:
        "200": { description: Product updated }
        "409": { description: Version conflict }
  /admin/card-products/{id}/status:
    post:
      summary: Publish or unpublish a card product
      tags: [Admin Cards]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200": { description: Status changed }
  /admin/members:
    get:
      summary: Search members and view aggregated card, order, and redemption metrics
      tags: [Admin Members]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Member number, nickname, or exact phone last four digits }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, DISABLED] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { description: Paginated member list }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/members/{id}:
    get:
      summary: Get a member profile with aggregated business metrics
      tags: [Admin Members]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Member detail }
        "404": { description: Member not found }
    put:
      summary: Update status, tags, and internal note using optimistic locking
      tags: [Admin Members]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, tags, admin_note, version]
              properties:
                status: { type: string, enum: [ACTIVE, DISABLED] }
                tags: { type: array, maxItems: 10, items: { type: string, maxLength: 20 } }
                admin_note: { type: string, maxLength: 500 }
                version: { type: integer, minimum: 1 }
      responses:
        "200": { description: Member updated }
        "409": { description: Version conflict }
  /admin/orders:
    get:
      summary: Search orders with member, payment, card, redemption, and refund data
      tags: [Admin Orders]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Order number, member number, nickname, or exact phone last four digits }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, PAID, CLOSED, REFUNDING, REFUNDED] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { description: Paginated order list }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/orders/{order_no}:
    get:
      summary: Get order, payment, issued card, redemption, and refund details
      tags: [Admin Orders]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: order_no, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Order detail }
        "404": { description: Order not found }
  /admin/orders/{order_no}/refund:
    post:
      summary: Request a full refund from the Web admin only
      tags: [Admin Orders]
      security: [{ adminCookie: [] }]
      parameters:
        - { name: order_no, in: path, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, client_request_id]
              properties:
                reason: { type: string, minLength: 1, maxLength: 255 }
                client_request_id: { type: string, maxLength: 64 }
      responses:
        "200": { description: Refund request accepted }
        "409": { description: Refund not allowed }
        "503": { description: WeChat Pay refund is not configured; no order state is changed }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminCookie:
      type: apiKey
      in: cookie
      name: urock_admin_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request
    Unauthorized:
      description: Authentication required
  schemas:
    CardProductStoreItem:
      type: object
      required: [id, name, short_description, description, product_type, total_times, validity_days, activation_mode, price_cent, daily_use_limit, transferable, rules, theme_color]
      properties:
        id: { type: string }
        name: { type: string }
        short_description: { type: string }
        description: { type: string }
        product_type: { type: string, enum: [COUNT_CARD, TIME_PASS] }
        total_times: { type: integer, nullable: true }
        validity_days: { type: integer }
        activation_mode: { type: string, enum: [PURCHASE, FIRST_USE] }
        price_cent: { type: integer }
        list_price_cent: { type: integer, nullable: true }
        purchase_limit: { type: integer, nullable: true }
        daily_use_limit: { type: integer }
        transferable: { type: boolean }
        rules: { type: string }
        badge: { type: string, nullable: true }
        theme_color: { type: string }
    CardProductInput:
      type: object
      required: [name, short_description, description, product_type, validity_days, activation_mode, price_cent, daily_use_limit, transferable, rules, theme_color, sort_order, version]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        short_description: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 5000 }
        product_type: { type: string, enum: [COUNT_CARD, TIME_PASS] }
        total_times: { type: integer, minimum: 1, maximum: 1000, nullable: true, description: Required for COUNT_CARD and null for TIME_PASS }
        validity_days: { type: integer, minimum: 1, maximum: 3650, description: TIME_PASS only accepts 7, 30, 90, or 365 }
        activation_mode: { type: string, enum: [PURCHASE, FIRST_USE], description: TIME_PASS must use FIRST_USE }
        price_cent: { type: integer, minimum: 1 }
        list_price_cent: { type: integer, minimum: 1, nullable: true }
        purchase_limit: { type: integer, minimum: 1, maximum: 100, nullable: true }
        daily_use_limit: { type: integer, minimum: 1, maximum: 20, description: TIME_PASS must equal 1 }
        transferable: { type: boolean, description: TIME_PASS must be false }
        rules: { type: string, maxLength: 5000 }
        badge: { type: string, maxLength: 32, nullable: true }
        theme_color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        sort_order: { type: integer }
        version: { type: integer, minimum: 0, description: Required and greater than zero when updating }
    CardProduct:
      allOf:
        - $ref: "#/components/schemas/CardProductInput"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id: { type: string }
            status: { type: string, enum: [DRAFT, ON_SALE, OFF_SALE] }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    OrderProductSnapshot:
      type: object
      required: [product_id, name, product_type, validity_days, activation_mode, price_cent, daily_use_limit, transferable]
      properties:
        product_id: { type: string }
        name: { type: string }
        product_type: { type: string, enum: [COUNT_CARD, TIME_PASS] }
        total_times: { type: integer, nullable: true }
        validity_days: { type: integer }
        activation_mode: { type: string, enum: [PURCHASE, FIRST_USE] }
        price_cent: { type: integer }
        daily_use_limit: { type: integer }
        transferable: { type: boolean }
    MemberOrder:
      type: object
      required: [order_no, status, biz_type, total_amount_cent, paid_amount_cent, product_snapshot, expires_at, created_at, updated_at]
      properties:
        order_no: { type: string }
        status: { type: string, enum: [PENDING, PAID, CLOSED, REFUNDING, REFUNDED] }
        biz_type: { type: string, enum: [CARD_PURCHASE] }
        total_amount_cent: { type: integer }
        paid_amount_cent: { type: integer }
        product_snapshot: { $ref: "#/components/schemas/OrderProductSnapshot" }
        expires_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AuthTokenEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [access_token, refresh_token, expires_in]
          properties:
            access_token: { type: string }
            refresh_token: { type: string }
            expires_in: { type: integer, example: 900 }
        request_id: { type: string }
    AdminSessionEnvelope:
      type: object
      required: [data, request_id]
      properties:
        data:
          type: object
          required: [user, csrf_token]
          properties:
            user:
              type: object
              required: [id, username, role, must_change_password]
              properties:
                id: { type: string }
                username: { type: string }
                nickname: { type: string, nullable: true }
                role: { type: string, enum: [ADMIN] }
                must_change_password: { type: boolean }
            csrf_token: { type: string }
        request_id: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
